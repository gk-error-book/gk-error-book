<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公考错题本 Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root { --primary: #4f46e5; --bg: #f3f4f6; }
  body { background: linear-gradient(135deg, #e0e7ff 0%, #f0fdfa 100%); min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .glass { background: rgba(255,255,255,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
  .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .nav-item.active { background: var(--primary); color: white; }
  .module-tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 9999px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 3px; }
  .scrub-canvas { touch-action: none; }
  .ring-timer { transform: rotate(-90deg); }
</style>
</head>
<body class="text-gray-800">
<div class="flex flex-col md:flex-row min-h-screen">
  <nav class="glass w-full md:w-60 lg:w-64 p-4 md:min-h-screen shrink-0 flex flex-col">
    <div class="flex items-center justify-between md:justify-start gap-2 mb-6">
      <div class="flex items-center gap-2">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-lg">📘</span>
        <h1 class="text-xl font-bold text-indigo-700 leading-tight">公考错题本</h1>
      </div>
      <button id="menuToggle" class="md:hidden text-indigo-600 text-2xl">☰</button>
    </div>
    <ul id="navList" class="hidden md:block space-y-1.5 flex-1">
      <li><button class="nav-item active w-full text-left px-4 py-3 rounded-xl font-medium transition flex items-center gap-3" data-view="overview">🏠 总览</button></li>
      <li><button class="nav-item w-full text-left px-4 py-3 rounded-xl font-medium transition flex items-center gap-3" data-view="list">📋 错题列表</button></li>
      <li><button class="nav-item w-full text-left px-4 py-3 rounded-xl font-medium transition flex items-center gap-3" data-view="add">➕ 添加错题</button></li>
      <li><button class="nav-item w-full text-left px-4 py-3 rounded-xl font-medium transition flex items-center gap-3" data-view="review">🎯 刷题复习</button></li>
      <li><button class="nav-item w-full text-left px-4 py-3 rounded-xl font-medium transition flex items-center gap-3 justify-between" data-view="plan">🧠 复习计划 <span id="planBadge" class="hidden bg-red-500 text-white rounded-full px-1.5 text-xs">0</span></button></li>
      <li><button class="nav-item w-full text-left px-4 py-3 rounded-xl font-medium transition flex items-center gap-3" data-view="analysis">📊 数据分析</button></li>
      <li><button class="nav-item w-full text-left px-4 py-3 rounded-xl font-medium transition flex items-center gap-3 justify-between" data-view="settings">⚙️ 设置/导出</button></li>
    </ul>
    <div class="hidden md:block mt-4 pt-4 border-t border-indigo-100 text-xs text-gray-400 leading-relaxed">
      Pro 学习版<br>数据存本机 · 定期备份
    </div>
  </nav>

  <main class="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
    <!-- 顶部栏：页面标题 + 添加错题 -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <h2 id="pageTitle" class="text-2xl font-bold text-gray-800">学习总览</h2>
        <p id="pageSub" class="text-sm text-gray-500">掌握备考全局，持续进步</p>
      </div>
      <button id="topAddBtn" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition font-medium shadow-lg shadow-indigo-200">＋ 添加错题</button>
    </div>

    <!-- 总览页 -->
    <div id="overviewArea"></div>

    <!-- 错题列表页 -->
    <div id="listArea" class="hidden">
      <div class="glass rounded-2xl p-4 mb-6 flex flex-wrap gap-2 items-center" id="moduleFilter"></div>
      <div id="errorList" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
    </div>

    <div id="reviewArea" class="hidden"></div>
    <div id="planArea" class="hidden"></div>
    <div id="speedArea" class="hidden"></div>
    <div id="analysisArea" class="hidden"></div>

    <!-- 设置/导出页 -->
    <div id="settingsArea" class="hidden">
      <div class="glass rounded-2xl p-6 mb-6">
        <h3 class="text-lg font-bold mb-4">📷 录入错题</h3>
        <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden">
        <div class="flex gap-3 flex-wrap">
          <button onclick="document.getElementById('imageInput').click()" class="px-4 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">📷 拍照/传图识别</button>
          <button id="addManualBtn" class="px-4 py-2.5 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">✏️ 手动添加</button>
          <button id="mockBtn" class="px-4 py-2.5 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition">⏱️ 模考计时</button>
        </div>
      </div>
      <div class="glass rounded-2xl p-6 mb-6">
        <h3 class="text-lg font-bold mb-4">📝 记录成绩</h3>
        <div class="flex flex-wrap gap-3 items-center">
          <input id="scoreGet" placeholder="得分" class="w-24 p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
          <select id="scoreTotal" class="p-2 border rounded-lg outline-none">
            <option value="100">/100</option><option value="120">/120</option><option value="150" selected>/150</option><option value="200">/200</option>
          </select>
          <input id="scoreName" placeholder="卷名（如：2025国考副省）" class="flex-1 min-w-[180px] p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
          <button id="scoreSave" class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition">记录成绩</button>
          <span id="scoreAvg" class="text-sm text-gray-600"></span>
        </div>
      </div>
      <div class="glass rounded-2xl p-6">
        <h3 class="text-lg font-bold mb-4">📤 数据导出 / 导入</h3>
        <div class="flex gap-3 flex-wrap">
          <button id="exportPDF" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">📄 导出 PDF</button>
          <button id="exportExcel" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">📊 导出 Excel</button>
          <button id="exportJSON" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">💾 备份(iCloud)</button>
          <input type="file" id="importJSON" accept=".json" class="hidden">
          <button onclick="document.getElementById('importJSON').click()" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">📥 恢复</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 添加/编辑弹窗 -->
<div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6">
    <h2 class="text-xl font-bold mb-4" id="modalTitle">添加错题</h2>
    <select id="mModule" class="w-full mb-3 p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
      <option value="资料分析">📊 资料分析</option><option value="数量关系">🔢 数量关系</option>
      <option value="言语理解">📖 言语理解</option><option value="判断推理">🧩 判断推理</option>
      <option value="常识判断">🌍 常识判断</option><option value="申论">✍️ 申论</option>
    </select>
    <textarea id="mQuestion" rows="4" placeholder="题目内容..." class="w-full mb-3 p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
    <input id="mAnswer" placeholder="你的答案" class="w-full mb-3 p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
    <input id="mCorrect" placeholder="正确答案" class="w-full mb-3 p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
    <textarea id="mReason" rows="3" placeholder="错误原因（留空则自动分析）" class="w-full mb-3 p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
    <div class="flex justify-end gap-3">
      <button id="mCancel" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 transition">取消</button>
      <button id="mSave" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">保存</button>
    </div>
  </div>
</div>

<!-- OCR 多题切分弹窗 -->
<div id="ocrModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6">
    <h2 class="text-xl font-bold mb-2">📷 OCR 识别结果</h2>
    <p class="text-sm text-gray-500 mb-4">已自动按题号切分为 <span id="ocrCount" class="font-bold text-indigo-600">0</span> 道题，请核对后批量保存：</p>
    <div id="ocrList" class="space-y-3 mb-4"></div>
    <div class="flex justify-end gap-3">
      <button id="ocrCancel" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 transition">取消</button>
      <button id="ocrSave" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">✅ 批量保存</button>
    </div>
  </div>
</div>

<!-- 草稿纸弹窗 -->
<div id="scrubModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[60]">
  <div class="bg-white rounded-2xl w-full max-w-2xl h-[85vh] flex flex-col p-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-lg font-bold">✏️ 草稿纸</h2>
      <button id="scrubClose" class="text-gray-500 text-2xl">×</button>
    </div>
    <div class="flex gap-2 mb-2 flex-wrap items-center">
      <input type="color" id="scrubColor" value="#000000" class="w-10 h-10 rounded cursor-pointer">
      <input type="range" id="scrubSize" min="1" max="10" value="3" class="w-32">
      <button id="scrubUndo" class="px-3 py-1 bg-yellow-500 text-white rounded hover:bg-yellow-600 text-sm">↩ 撤销</button>
      <button id="scrubClear" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-sm">🗑 清空</button>
    </div>
    <canvas id="scrubCanvas" class="scrub-canvas flex-1 w-full bg-[repeating-linear-gradient(transparent,transparent_31px,#e5e7eb_32px)] border rounded-lg"></canvas>
    <textarea id="scrubText" rows="2" placeholder="文字笔记（列式、推导...）" class="w-full mt-2 p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
  </div>
</div>

<!-- 模考计时弹窗 -->
<div id="mockModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[60]">
  <div class="bg-white rounded-2xl w-full max-w-md p-6 text-center">
    <h2 class="text-xl font-bold mb-4">⏱️ 模考计时器</h2>
    <svg width="200" height="200" class="mx-auto">
      <circle cx="100" cy="100" r="90" stroke="#e5e7eb" stroke-width="12" fill="none"/>
      <circle id="timerRing" class="ring-timer" cx="100" cy="100" r="90" stroke="#4f46e5" stroke-width="12" fill="none" stroke-dasharray="565" stroke-dashoffset="0"/>
      <text id="timerText" x="100" y="112" text-anchor="middle" font-size="32" font-weight="bold">00:00</text>
    </svg>
    <div class="my-4 text-sm text-gray-500" id="timerTip">建议：常识8min · 言语35 · 数量20 · 判断35 · 资料25</div>
    <div class="flex gap-2 justify-center mb-4">
      <button id="timerStart" class="px-4 py-2 bg-green-600 text-white rounded-lg">开始</button>
      <button id="timerPause" class="px-4 py-2 bg-yellow-600 text-white rounded-lg">暂停</button>
      <button id="timerReset" class="px-4 py-2 bg-gray-500 text-white rounded-lg">重置</button>
    </div>
    <input id="timerLimit" type="number" value="120" class="w-24 p-2 border rounded-lg text-center"> 分钟
    <div class="mt-4"><button id="timerDone" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">记录本次用时</button></div>
  </div>
</div>

<script>
// ========== 数据 ==========
let errors = JSON.parse(localStorage.getItem('gk_errors') || '[]');
let scores = JSON.parse(localStorage.getItem('gk_scores') || '[]');
let attempts = JSON.parse(localStorage.getItem('gk_attempts') || '[]');
let favs = JSON.parse(localStorage.getItem('gk_favs') || '[]');
let scrubs = JSON.parse(localStorage.getItem('gk_scrubs') || '{}');
let currentModule = 'all';
let editId = null;
let timerInterval = null, timerSeconds = 0, timerRunning = false;

// 旧数据迁移：补齐复习节点
errors = errors.map(e => {
  if (!e.reviewStages) {
    const base = new Date(e.date && !isNaN(new Date(e.date)) ? e.date : Date.now());
    e.reviewStages = [1,2,4,7,15].map(d => { const t = new Date(base); t.setDate(t.getDate()+d); return { day: d, date: t.toISOString().slice(0,10), done: false }; });
    e.mastered = false;
  }
  return e;
});
saveAll();

// ========== 题型分析规则库 ==========
const ANALYSIS_RULES = [
  { keywords: ['增长率', '增长量'], module: '资料分析', reason: '易混淆概念：增长率（相对量）与增长量（绝对量）区分不当', tag: '概念混淆' },
  { keywords: ['比重', '平均数'], module: '资料分析', reason: '比重与平均数增长率公式记忆混淆', tag: '公式误用' },
  { keywords: ['同比', '环比'], module: '资料分析', reason: '同比（与上年同期）与环比（上一统计周期）概念不清', tag: '概念混淆' },
  { keywords: ['单位', '%', '百分点'], module: '资料分析', reason: '单位换算错误：百分数与百分点混淆', tag: '细节疏忽' },
  { keywords: ['两期', '比重差'], module: '资料分析', reason: '两期比重比较方向判断错误', tag: '逻辑错误' },
  { keywords: ['排列', '组合'], module: '数量关系', reason: '排列（有序）与组合（无序）区分不当', tag: '概念混淆' },
  { keywords: ['相遇', '追及'], module: '数量关系', reason: '行程问题：相遇/追及公式套用错误', tag: '公式误用' },
  { keywords: ['利润', '折扣'], module: '数量关系', reason: '利润问题中成本与售价基准混淆', tag: '计算错误' },
  { keywords: ['容斥', '集合'], module: '数量关系', reason: '容斥原理公式记忆错误或未画图辅助', tag: '公式误用' },
  { keywords: ['工程', '效率'], module: '数量关系', reason: '工程问题赋总量法使用不当', tag: '方法不当' },
  { keywords: ['主旨', '意图'], module: '言语理解', reason: '主旨概括题未抓住文段核心观点，过度推断', tag: '理解偏差' },
  { keywords: ['逻辑填空', '成语'], module: '言语理解', reason: '成语辨析不准确，语境分析不足', tag: '词汇积累' },
  { keywords: ['转折', '因果'], module: '言语理解', reason: '关联词引导的重点句定位错误', tag: '结构分析' },
  { keywords: ['语句排序'], module: '言语理解', reason: '语句排序未利用首尾句特征或捆绑集团', tag: '方法不当' },
  { keywords: ['削弱', '加强'], module: '判断推理', reason: '论证逻辑：削弱/加强方式判断错误（拆桥/搭桥混淆）', tag: '逻辑错误' },
  { keywords: ['图形', '对称'], module: '判断推理', reason: '图形推理：对称性/数量规律优先考虑顺序错误', tag: '规律遗漏' },
  { keywords: ['类比', '包含'], module: '判断推理', reason: '类比推理：种属关系与组成关系区分不清', tag: '概念混淆' },
  { keywords: ['定义', '主体'], module: '判断推理', reason: '定义判断未抓住主体、客体或行为方式关键词', tag: '细节疏忽' },
  { keywords: ['宪法', '法律'], module: '常识判断', reason: '法律常识：宪法条文记忆不准确', tag: '记忆模糊' },
  { keywords: ['历史', '朝代'], module: '常识判断', reason: '历史常识：事件时间线混淆', tag: '记忆模糊' },
  { keywords: ['经济', 'GDP'], module: '常识判断', reason: '经济术语概念理解偏差', tag: '概念混淆' },
  { keywords: ['概括', '归纳'], module: '申论', reason: '归纳概括题要点遗漏或分类标准不统一', tag: '要点不全' },
  { keywords: ['对策', '建议'], module: '申论', reason: '提出对策题缺乏针对性或可操作性', tag: '逻辑不清' },
  { keywords: ['公文', '格式'], module: '申论', reason: '公文写作格式错误（标题/称谓/落款缺失）', tag: '格式错误' },
];
function autoAnalyze(text, module) {
  for (let rule of ANALYSIS_RULES) {
    if (module && rule.module !== module) continue;
    if (rule.keywords.some(k => text.includes(k))) return { reason: rule.reason, tag: rule.tag };
  }
  return { reason: '请手动补充具体错因（如：计算失误、审题不清、知识点盲区等）', tag: '待分析' };
}

// ========== 持久化 ==========
function saveAll() {
  localStorage.setItem('gk_errors', JSON.stringify(errors));
  localStorage.setItem('gk_scores', JSON.stringify(scores));
  localStorage.setItem('gk_attempts', JSON.stringify(attempts));
  localStorage.setItem('gk_favs', JSON.stringify(favs));
  localStorage.setItem('gk_scrubs', JSON.stringify(scrubs));
}

// ========== 渲染列表 ==========
function renderList() {
  hideAllAreas();
  document.getElementById('listArea').classList.remove('hidden');
  renderModuleFilter();
  const list = document.getElementById('errorList');
  const filtered = currentModule === 'all' ? errors : errors.filter(e => e.module === currentModule);
  if (filtered.length === 0) { list.innerHTML = '<div class="col-span-full text-center text-gray-500 py-12">暂无错题，点击上方按钮添加吧～</div>'; return; }
  list.innerHTML = filtered.map(e => `
    <div class="glass rounded-xl p-5 card-hover" data-id="${e.id}">
      <div class="flex justify-between items-start mb-3">
        <span class="module-tag bg-indigo-100 text-indigo-700">${e.module}</span>
        <div class="flex gap-2 items-center">
          <button onclick="toggleFav('${e.id}')" class="text-xl leading-none" title="收藏">${favs.includes(e.id) ? '⭐' : '☆'}</button>
          <span class="module-tag bg-gray-100 text-gray-600">${e.tag}</span>
        </div>
      </div>
      <p class="text-sm mb-2 line-clamp-3"><span class="font-semibold">题目：</span>${e.question}</p>
      <p class="text-sm mb-1"><span class="font-semibold text-red-600">你的答案：</span>${e.userAnswer}</p>
      <p class="text-sm mb-1"><span class="font-semibold text-green-600">正确答案：</span>${e.correctAnswer}</p>
      <p class="text-sm mb-3"><span class="font-semibold text-amber-600">错因：</span>${e.reason}</p>
      <div class="flex gap-2 flex-wrap">
        <button onclick="editError('${e.id}')" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 text-xs">编辑</button>
        <button onclick="deleteError('${e.id}')" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-xs">删除</button>
      </div>
    </div>`).join('');
}

function renderModuleFilter() {
  const wrap = document.getElementById('moduleFilter');
  if (!wrap) return;
  const modules = ['all','资料分析','数量关系','言语理解','判断推理','常识判断','申论'];
  wrap.innerHTML = modules.map(m => `<button onclick="setModule('${m}')" class="px-3 py-1.5 rounded-lg text-sm transition ${currentModule===m?'bg-indigo-600 text-white':'bg-white text-gray-600 hover:bg-indigo-50'}">${m==='all'?'全部':m}</button>`).join('');
}
function setModule(m) { currentModule = m; renderList(); }

function hideAllAreas() {
  ['overviewArea','listArea','reviewArea','planArea','speedArea','analysisArea','settingsArea','errorList'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hidden'); });
}

function startReview(pool) {
  const filtered = pool || (currentModule === 'all' ? errors : errors.filter(e => e.module === currentModule));
  if (filtered.length === 0) return alert('当前模块没有错题哦！');
  const shuffled = filtered.sort(() => Math.random() - 0.5);
  hideAllAreas();
  const area = document.getElementById('reviewArea');
  area.classList.remove('hidden');
  let idx = 0, correct = 0;

  function showCard() {
    if (idx >= shuffled.length) {
      area.innerHTML = `<div class="glass rounded-2xl p-8 text-center"><h2 class="text-2xl font-bold mb-4">🎉 复习完成！</h2><p class="text-lg">正确率：${correct}/${shuffled.length} (${Math.round(correct/shuffled.length*100)}%)</p><button onclick="renderList()" class="mt-4 px-6 py-2 bg-indigo-600 text-white rounded-lg">返回</button></div>`;
      updateBadges(); return;
    }
    const e = shuffled[idx];
    const start = Date.now();
    area.innerHTML = `
      <div class="glass rounded-2xl p-6">
        <div class="flex justify-between items-center mb-2">
          <div class="text-sm text-indigo-600 font-medium">${e.module} · 第 ${idx+1}/${shuffled.length} 题</div>
          <button onclick="openScrub('${e.id}')" class="text-sm px-3 py-1 bg-amber-100 text-amber-700 rounded-lg">✏️ 草稿纸${scrubs[e.id] ? ' ●' : ''}</button>
        </div>
        <p class="mb-4 text-lg">${e.question}</p>
        <input id="reviewInput" placeholder="输入你的答案" class="w-full mb-4 p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        <div id="reviewFeedback" class="hidden mb-4 p-4 rounded-lg"></div>
        <div class="flex gap-3">
          <button id="submitReview" class="px-6 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">提交</button>
          <button onclick="renderList()" class="px-6 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-500">退出</button>
        </div>
      </div>`;
    document.getElementById('submitReview').onclick = () => {
      const ans = document.getElementById('reviewInput').value.trim();
      const used = Math.round((Date.now() - start)/1000);
      const fb = document.getElementById('reviewFeedback');
      fb.classList.remove('hidden');
      const isCorrect = ans === e.correctAnswer;
      if (isCorrect) { fb.className = 'mb-4 p-4 rounded-lg bg-green-100 text-green-800'; fb.innerHTML = `✅ 正确！(用时${used}s)<br>解析：${e.reason}`; correct++; advanceStage(e.id); }
      else { fb.className = 'mb-4 p-4 rounded-lg bg-red-100 text-red-800'; fb.innerHTML = `❌ 错误！正确答案：<strong>${e.correctAnswer}</strong><br>错因：${e.reason}`; }
      attempts.push({ id: e.id, module: e.module, correct: isCorrect, time: used, date: new Date().toISOString().slice(0,10) });
      saveAll();
      idx++;
      setTimeout(() => { fb.innerHTML += '<br><button class="mt-3 px-4 py-2 bg-indigo-600 text-white rounded-lg" onclick="showCard()">下一题</button>'; }, 700);
    };
  }
  showCard();
}

function advanceStage(id) {
  const e = errors.find(x => x.id === id);
  if (!e) return;
  const next = e.reviewStages.find(s => !s.done);
  if (next) next.done = true;
  if (e.reviewStages.every(s => s.done)) e.mastered = true;
  saveAll();
}

// ========== OCR 一图多题 ==========
document.getElementById('imageInput').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  const btn = document.querySelector('button[onclick*="imageInput"]');
  const original = btn.innerHTML; btn.innerHTML = '⏳ 识别中...';
  try {
    const { data: { text } } = await Tesseract.recognize(file, 'chi_sim+eng');
    const questions = splitQuestions(text);
    showOcrModal(questions);
  } catch (err) { alert('识别失败：' + err.message); }
  finally { btn.innerHTML = original; }
});

function splitQuestions(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const patterns = [/^\d+[\.、．]/, /^（\d+）/, /^第\d+题/, /^[①②③④⑤⑥⑦⑧⑨]/];
  let groups = [], current = null;
  lines.forEach(line => {
    const isNum = patterns.some(p => p.test(line));
    if (isNum && current !== null) { groups.push(current); current = line; }
    else if (isNum) { current = line; }
    else if (current !== null) current += '\n' + line;
    else { current = line; }
  });
  if (current !== null) groups.push(current);
  if (groups.length === 0) groups = [text];
  return groups.map(g => {
    const module = guessModule(g);
    const a = autoAnalyze(g, module);
    return { module, text: g, answer: '', correct: '', reason: a.reason, tag: a.tag };
  });
}
function guessModule(text) {
  if (/增长|比重|同比|环比|百分数/.test(text)) return '资料分析';
  if (/排列|组合|工程|利润|行程|容斥/.test(text)) return '数量关系';
  if (/主旨|意图|填空|成语|转折|因果/.test(text)) return '言语理解';
  if (/削弱|加强|图形|类比|定义/.test(text)) return '判断推理';
  if (/宪法|法律|历史|朝代|GDP|经济/.test(text)) return '常识判断';
  return '资料分析';
}
function showOcrModal(questions) {
  document.getElementById('ocrCount').textContent = questions.length;
  const list = document.getElementById('ocrList');
  list.innerHTML = questions.map((q, i) => `
    <div class="border rounded-xl p-3" data-idx="${i}">

          ${['资料分析','数量关系','言语理解','判断推理','常识判断','申论'].map(m=>`<option ${m===q.module?'selected':''}>${m}</option>`).join('')}
        </select>
        <button onclick="this.closest('.border').remove();document.getElementById('ocrCount').textContent=document.getElementById('ocrList').children.length" class="px-2 py-1 bg-red-500 text-white rounded text-sm">删此题</button>
      </div>
      <textarea class="ocr-text w-full p-2 border rounded-lg text-sm" rows="3">${q.text}</textarea>
      <div class="flex gap-2 mt-2">
        <input class="ocr-answer flex-1 p-2 border rounded-lg text-sm" placeholder="你的答案" value="${q.answer}">
        <input class="ocr-correct flex-1 p-2 border rounded-lg text-sm" placeholder="正确答案" value="${q.correct}">
      </div>

// ========== 草稿纸 ==========
let scrubId = null, scrubCtx = null, scrubDrawing = false, scrubHistory = [];
function openScrub(id) {
  scrubId = id;
  document.getElementById('scrubModal').classList.remove('hidden');
  document.getElementById('scrubModal').classList.add('flex');
  const canvas = document.getElementById('scrubCanvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width - 32; canvas.height = rect.height - 120;
  scrubCtx = canvas.getContext('2d');
  scrubHistory = [];
  const data = scrubs[id] || { strokes: [], text: '' };
  document.getElementById('scrubText').value = data.text || '';
  (data.strokes || []).forEach(s => drawStroke(s));
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.touches ? e.touches[0].clientX - r.left : e.clientX - r.left, y: e.touches ? e.touches[0].clientY - r.top : e.clientY - r.top }; };
  const start = e => { scrubDrawing = true; scrubHistory.push([]); draw(e); };
  const draw = e => { if (!scrubDrawing) return; const p = pos(e); const stroke = scrubHistory[scrubHistory.length-1]; stroke.push(p); const color = document.getElementById('scrubColor').value; const size = +document.getElementById('scrubSize').value; scrubCtx.strokeStyle = color; scrubCtx.lineWidth = size; scrubCtx.lineCap = 'round'; if (stroke.length > 1) { const prev = stroke[stroke.length-2]; scrubCtx.beginPath(); scrubCtx.moveTo(prev.x, prev.y); scrubCtx.lineTo(p.x, p.y); scrubCtx.stroke(); } };
  const end = () => { scrubDrawing = false; saveScrub(); };
  canvas.ontouchstart = start; canvas.ontouchmove = e => { e.preventDefault(); draw(e); }; canvas.ontouchend = end;
  canvas.onmousedown = start; canvas.onmousemove = draw; canvas.onmouseup = end; canvas.onmouseleave = end;
}
function drawStroke(stroke) { if (!scrubCtx || stroke.length < 2) return; scrubCtx.strokeStyle = stroke[0].color; scrubCtx.lineWidth = stroke[0].size; scrubCtx.lineCap = 'round'; scrubCtx.beginPath(); scrubCtx.moveTo(stroke[0].x, stroke[0].y); for (let i=1;i<stroke.length;i++){ scrubCtx.lineTo(stroke[i].x, stroke[i].y); } scrubCtx.stroke(); }
function saveScrub() {
  const strokes = scrubHistory.filter(s => s.length > 1).map(s => s.map(p => ({ x: p.x, y: p.y, color: document.getElementById('scrubColor').value, size: +document.getElementById('scrubSize').value })));
  scrubs[scrubId] = { strokes, text: document.getElementById('scrubText').value };
  saveAll();
}
document.getElementById('scrubClose').onclick = () => { saveScrub(); document.getElementById('scrubModal').classList.add('hidden'); document.getElementById('scrubModal').classList.remove('flex'); };
document.getElementById('scrubUndo').onclick = () => { scrubHistory.pop(); redrawAll(); saveScrub(); };
document.getElementById('scrubClear').onclick = () => { scrubHistory = []; redrawAll(); saveScrub(); };
function redrawAll() { if (!scrubCtx) return; scrubCtx.clearRect(0,0, scrubCanvas.width, scrubCanvas.height); scrubHistory.forEach(s => drawStroke(s)); }

  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <div class="glass rounded-xl p-4"><h3 class="font-bold mb-2">📈 正确率趋势（近20次）</h3><canvas id="lineChart" height="200"></canvas></div>
    <div class="glass rounded-xl p-4"><h3 class="font-bold mb-2">🎯 模块正确率</h3><canvas id="radarChart" height="200"></canvas></div>
  </div>
  <div class="glass rounded-xl p-4 mt-4"><h3 class="font-bold mb-2">🔥 薄弱知识点</h3><div id="weakTags" class="flex flex-wrap gap-2"></div></div>`;
  renderScores();
  // 折线图
  const recent = attempts.slice(-20);
  const ctxL = document.getElementById('lineChart').getContext('2d');
  if (chartLine) chartLine.destroy();
  chartLine = new Chart(ctxL, { type: 'line', data: { labels: recent.map((_,i)=>i+1), datasets: [{ label:'正确率', data: recent.map(a=>a.correct?100:0), borderColor:'#4f46e5', tension:0.3, fill:true, backgroundColor:'rgba(79,70,229,0.1)' }] }, options: { scales: { y: { min:0, max:100 } } } });
  // 雷达图（五模块）
  const modules = ['资料分析','数量关系','言语理解','判断推理','常识判断'];
  const radarData = modules.map(m => {
    const ms = attempts.filter(a => a.module === m);
    return ms.length ? Math.round(ms.filter(a=>a.correct).length/ms.length*100) : 0;
  });
  const ctxR = document.getElementById('radarChart').getContext('2d');
  if (chartRadar) chartRadar.destroy();
  chartRadar = new Chart(ctxR, { type: 'radar', data: { labels: modules, datasets: [{ label:'正确率', data: radarData, borderColor:'#10b981', backgroundColor:'rgba(16,185,129,0.2)' }] }, options: { scales: { r: { min:0, max:100 } } } });
  // 薄弱标签
  const tagCount = {};
  errors.forEach(e => { tagCount[e.tag] = (tagCount[e.tag]||0)+1; });
  const weak = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  document.getElementById('weakTags').innerHTML = weak.map(([t,c])=>`<span class="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm" style="font-size:${Math.min(1.6, 0.8+c*0.15)}rem">${t} ×${c}</span>`).join('') || '<span class="text-gray-500">刷题后自动生成</span>';
}

// ========== 总览页（学习总览） ==========
let overviewChart = null;
function renderOverview() {
  hideAllAreas();
  const area = document.getElementById('overviewArea');
  area.classList.remove('hidden');
  const total = errors.length;
  const mastered = errors.filter(e => e.mastered).length;
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  const weekNew = errors.filter(e => new Date(e.date) >= weekAgo).length;
  const modules = ['资料分析','数量关系','言语理解','判断推理','常识判断','申论'];
  const dist = modules.map(m => errors.filter(e => e.module === m).length);
  // 薄弱分类：正确率最低（attempts 中）
  const weakMod = modules.map(m => { const ms = attempts.filter(a => a.module === m); return { m, rate: ms.length ? ms.filter(a=>a.correct).length/ms.length : (errors.filter(e=>e.module===m).length?1:null) }; }).filter(x => x.rate !== null).sort((a,b)=>a.rate-b.rate)[0];
  // 标签云
  const tagCount = {};
  errors.forEach(e => { tagCount[e.tag] = (tagCount[e.tag]||0)+1; });
  const weakTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const recent = errors.slice().sort((a,b)=> (b.id||'').localeCompare(a.id||'')).slice(0,5);

  area.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="glass rounded-2xl p-5 card-hover"><div class="text-3xl font-bold text-indigo-600">${total}</div><div class="text-sm text-gray-500 mt-1">总错题数</div></div>
      <div class="glass rounded-2xl p-5 card-hover"><div class="text-3xl font-bold text-green-600">${mastered}</div><div class="text-sm text-gray-500 mt-1">已复习掌握</div></div>
      <div class="glass rounded-2xl p-5 card-hover"><div class="text-3xl font-bold text-amber-500">${weekNew}</div><div class="text-sm text-gray-500 mt-1">本周新增</div></div>
      <div class="glass rounded-2xl p-5 card-hover"><div class="text-lg font-bold text-rose-600 leading-tight">${weakMod ? weakMod.m : '—'}</div><div class="text-sm text-gray-500 mt-1">薄弱分类</div></div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
      <div class="glass rounded-2xl p-5"><h3 class="font-bold mb-3">📊 分类分布</h3><canvas id="overviewBar" height="180"></canvas></div>
      <div class="glass rounded-2xl p-5"><h3 class="font-bold mb-3">🔥 薄弱知识点</h3><div id="overviewWeak" class="flex flex-wrap gap-2"></div></div>
    </div>
    <div class="glass rounded-2xl p-5"><h3 class="font-bold mb-3">🕘 最近添加</h3><div id="overviewRecent" class="divide-y"></div></div>
  `;
  // 分类分布柱状图
  const ctx = document.getElementById('overviewBar').getContext('2d');
  if (overviewChart) overviewChart.destroy();
  overviewChart = new Chart(ctx, {
    type: 'bar',
    data: { labels: modules, datasets: [{ label:'错题数', data: dist, backgroundColor: ['#6366f1','#ec4899','#f59e0b','#10b981','#06b6d4','#8b5cf6'] }] },
    options: { plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:true, ticks:{stepSize:1} } } }
  });
  document.getElementById('overviewWeak').innerHTML = weakTags.map(([t,c])=>`<span class="px-3 py-1 bg-rose-100 text-rose-700 rounded-full text-sm" style="font-size:${Math.min(1.5,0.8+c*0.15)}rem">${t} ×${c}</span>`).join('') || '<span class="text-gray-400 text-sm">录入错题后自动生成</span>';
  document.getElementById('overviewRecent').innerHTML = recent.length ? recent.map(e=>`<div class="py-3 flex justify-between gap-3"><div class="min-w-0"><span class="module-tag bg-indigo-100 text-indigo-700">${e.module}</span><p class="text-sm mt-1 truncate">${e.question}</p></div><span class="text-xs text-gray-400 shrink-0">${e.date||''}</span></div>`).join('') : '<div class="py-6 text-center text-gray-400 text-sm">暂无错题记录</div>';
  renderScores();
}

// ========== 弹窗 ==========
function openModal() {
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal').classList.add('flex');
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); editId = null; }
document.getElementById('addManualBtn').onclick = () => { editId = null; document.getElementById('modalTitle').textContent = '添加错题'; document.getElementById('mModule').value='资料分析'; document.getElementById('mQuestion').value=''; document.getElementById('mAnswer').value=''; document.getElementById('mCorrect').value=''; document.getElementById('mReason').value=''; openModal(); };
document.getElementById('mCancel').onclick = closeModal;
document.getElementById('mSave').onclick = () => {
  const module = document.getElementById('mModule').value;
  const question = document.getElementById('mQuestion').value.trim();
  const userAnswer = document.getElementById('mAnswer').value.trim();
  const correctAnswer = document.getElementById('mCorrect').value.trim();
  let reason = document.getElementById('mReason').value.trim();
  if (!question || !correctAnswer) return alert('请填写题目和正确答案');
  if (!reason) { const a = autoAnalyze(question, module); reason = a.reason; }
  const a = autoAnalyze(question, module);
  const baseDate = new Date();
  if (editId) {
    const idx = errors.findIndex(e => e.id === editId);
    if (idx > -1) errors[idx] = { ...errors[idx], module, question, userAnswer, correctAnswer, reason, tag: a.tag };
  } else {
    errors.push({ id: Date.now().toString(), module, question, userAnswer, correctAnswer, reason, tag: a.tag, date: baseDate.toLocaleDateString(),
      reviewStages: [1,2,4,7,15].map(d => { const t = new Date(baseDate); t.setDate(t.getDate()+d); return { day: d, date: t.toISOString().slice(0,10), done: false }; }), mastered: false });
  }
  saveAll(); renderList(); updateBadges(); closeModal();
};
function editError(id) { editId = id; const e = errors.find(x => x.id === id); if(!e) return; document.getElementById('modalTitle').textContent = '编辑错题'; document.getElementById('mModule').value = e.module; document.getElementById('mQuestion').value = e.question; document.getElementById('mAnswer').value = e.userAnswer; document.getElementById('mCorrect').value = e.correctAnswer; document.getElementById('mReason').value = e.reason; openModal(); }
function deleteError(id) { if(confirm('确定删除？')){ errors = errors.filter(e => e.id !== id); favs = favs.filter(x=>x!==id); delete scrubs[id]; saveAll(); renderList(); updateBadges(); } }

// ========== 导出 ==========
document.getElementById('exportPDF').onclick = () => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 10;
  errors.forEach((e, i) => {
    if (y > 270) { doc.addPage(); y = 10; }
    doc.setFontSize(12); doc.text(`${i+1}. [${e.module}] ${e.question.substring(0,50)}...`, 10, y); y+=7;
    doc.setFontSize(10); doc.text(`你的答案：${e.userAnswer} | 正确答案：${e.correctAnswer}`, 10, y); y+=7;
    doc.text(`错因：${e.reason}`, 10, y); y+=10;
  });
  doc.save('公考错题本.pdf');
};
document.getElementById('exportExcel').onclick = () => {
  const ws = XLSX.utils.json_to_sheet(errors.map(e => ({ 模块:e.module, 题目:e.question, 你的答案:e.userAnswer, 正确答案:e.correctAnswer, 错因:e.reason, 标签:e.tag, 收藏:favs.includes(e.id), 用时:'' })));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '错题');
  XLSX.writeFile(wb, '公考错题本.xlsx');
};
document.getElementById('exportJSON').onclick = () => {
  const data = JSON.stringify({ errors, scores, attempts, favs, scrubs }, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `错题备份_${new Date().toISOString().slice(0,10)}.json`; a.click();
  alert('💡 提示：下载后可将文件移动到「iCloud 云盘」实现多设备同步！');
};
document.getElementById('importJSON').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.errors && Array.isArray(d.errors)) { errors = d.errors; scores = d.scores||[]; attempts = d.attempts||[]; favs = d.favs||[]; scrubs = d.scrubs||{}; saveAll(); renderList(); updateBadges(); alert(`✅ 成功恢复 ${errors.length} 道题！`); }
    } catch { alert('文件格式错误'); }
  };
  reader.readAsText(file);
});

// ========== 导航 ==========
const PAGE_TITLES = {
  overview: ['学习总览', '掌握备考全局，持续进步'],
  list: ['错题列表', '按模块筛选与管理你的错题'],
  add: ['添加错题', '录入新错题，AI 自动分析'],
  review: ['刷题复习', '进入刷题模式，答对推进复习节点'],
  plan: ['复习计划', '按艾宾浩斯遗忘曲线安排复习'],
  analysis: ['数据分析', '正确率趋势 · 模块雷达 · 薄弱知识点'],
  settings: ['设置 / 导出', '录入、记录成绩与数据备份恢复'],
};
function switchView(view) {
  hideAllAreas();
  const titles = PAGE_TITLES[view] || ['', ''];
  const pt = document.getElementById('pageTitle'); const ps = document.getElementById('pageSub');
  if (pt) pt.textContent = titles[0]; if (ps) ps.textContent = titles[1];
  if (view === 'overview') renderOverview();
  else if (view === 'list') { currentModule = 'all'; renderList(); }
  else if (view === 'add') { editId = null; document.getElementById('modalTitle').textContent = '添加错题'; document.getElementById('mModule').value='资料分析'; document.getElementById('mQuestion').value=''; document.getElementById('mAnswer').value=''; document.getElementById('mCorrect').value=''; document.getElementById('mReason').value=''; openModal(); }
  else if (view === 'review') { currentModule = 'all'; startReview(); }
  else if (view === 'plan') renderPlan();
  else if (view === 'analysis') renderDash();
  else if (view === 'settings') { renderScores(); }
  if (view !== 'plan' && view !== 'analysis') { /* badges 保持 */ }
}
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    switchView(btn.dataset.view);
    // 移动端点击后收起菜单
    if (window.innerWidth < 768) document.getElementById('navList').classList.add('hidden');
  });
});
// 顶部「＋ 添加错题」
document.getElementById('topAddBtn').onclick = () => { setActiveNav('add'); switchView('add'); };
function setActiveNav(view) { document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view)); }
document.getElementById('reviewBtn') && (document.getElementById('reviewBtn').onclick = () => { setActiveNav('review'); switchView('review'); });
document.getElementById('planBtn').onclick = () => { setActiveNav('plan'); switchView('plan'); };
document.getElementById('favBtn') && (document.getElementById('favBtn').onclick = () => { setActiveNav('list'); switchView('list'); });
document.getElementById('speedBtn') && (document.getElementById('speedBtn').onclick = () => { setActiveNav('review'); switchView('review'); });
// 兼容：保留原 dashBtn 引用
document.getElementById('dashBtn') && (document.getElementById('dashBtn').onclick = () => { setActiveNav('analysis'); switchView('analysis'); });
document.getElementById('menuToggle').onclick = () => document.getElementById('navList').classList.toggle('hidden');

// 初始化
switchView('overview'); renderScores(); updateBadges();
</script>
</body>
</html>
