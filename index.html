<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公考错题本</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#5e72e4;--primary-dark:#4a5bcf;--sidebar-w:240px;--bg:#f4f6fa;--card:#fff;--text:#333;--text-light:#888;--border:#e2e8f0;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08)}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;height:100%}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--primary),#7c3aed);color:#fff;display:flex;flex-direction:column;transition:transform .3s}
.sidebar .logo{padding:24px 20px 16px;font-size:20px;font-weight:700;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.15)}
.sidebar .menu{flex:1;overflow-y:auto;padding:12px 0}
.sidebar .menu-item{padding:12px 24px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:15px;transition:.2s}
.sidebar .menu-item:hover,.sidebar .menu-item.active{background:rgba(255,255,255,.18)}
.sidebar .menu-item .badge{margin-left:auto;background:rgba(255,255,255,.3);border-radius:10px;padding:1px 7px;font-size:12px}
.sidebar .footer{padding:12px 24px;border-top:1px solid rgba(255,255,255,.15);font-size:13px;opacity:.8}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:var(--shadow)}
.topbar h2{font-size:18px;font-weight:600}
.topbar .add-btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.topbar .add-btn:active{background:var(--primary-dark)}
.content{flex:1;overflow-y:auto;padding:24px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.card h3{margin-bottom:14px;font-size:16px}
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.module-btn{padding:18px 12px;text-align:center;border-radius:10px;border:2px solid var(--border);background:#fff;cursor:pointer;font-size:14px;font-weight:500;transition:.2s}
.module-btn:active{border-color:var(--primary);color:var(--primary)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}
th{background:#f8fafc;font-weight:600}
.timer-display{font-size:48px;font-weight:700;text-align:center;padding:30px 0;font-variant-numeric:tabular-nums}
.timer-controls{display:flex;justify-content:center;gap:16px;margin-bottom:20px}
.timer-controls button{padding:10px 24px;border-radius:8px;border:none;font-size:15px;cursor:pointer}
.btn-start{background:var(--primary);color:#fff}
.btn-reset{background:#e2e8f0}
.draft-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:100}
.draft-box{position:absolute;bottom:0;left:0;right:0;height:60%;background:#fff;border-radius:16px 16px 0 0;padding:20px}
.draft-box textarea{width:100%;height:80%;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:15px;resize:none}
.chart-container{position:relative;height:260px;margin-bottom:20px}
.hidden{display:none!important}
@media(max-width:768px){
  .sidebar{position:fixed;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;z-index:50}
  .sidebar .logo,.sidebar .footer{display:none}
  .sidebar .menu{display:flex;overflow-x:auto;padding:0}
  .sidebar .menu-item{padding:10px 14px;font-size:12px;white-space:nowrap}
  .main{margin-bottom:60px}
  .topbar{padding:0 16px}
  .content{padding:16px}
}
.export-btns{display:flex;gap:12px;flex-wrap:wrap}
.export-btns button{padding:10px 20px;border-radius:8px;border:1px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;font-size:14px}
.export-btns button:active{background:var(--primary);color:#fff}
input,select,textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px}
label{font-size:13px;font-weight:600;margin-bottom:4px;display:block}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="logo">📘 公考错题本</div>
    <div class="menu" id="menu">
      <div class="menu-item active" data-page="overview">📊 总览</div>
      <div class="menu-item" data-page="list">📋 错题列表</div>
      <div class="menu-item" data-page="add">➕ 添加错题</div>
      <div class="menu-item" data-page="practice">📝 刷题复习</div>
      <div class="menu-item" data-page="speed">🧮 速算训练</div>
      <div class="menu-item" data-page="favorites">⭐ 收藏夹<span class="badge" id="favBadge">0</span></div>
      <div class="menu-item" data-page="review">🧠 复习计划</div>
      <div class="menu-item" data-page="timer">⏱️ 模考计时</div>
      <div class="menu-item" data-page="analytics">📈 数据分析</div>
      <div class="menu-item" data-page="settings">⚙️ 设置导出</div>
    </div>
    <div class="footer">iPad 适配 · 单文件版</div>
  </div>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">总览</h2>
      <button class="add-btn" onclick="switchPage('add')">＋ 添加错题</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="draft-overlay" id="draftOverlay">
  <div class="draft-box">
    <h3>✏️ 草稿纸</h3>
    <textarea id="draftText" placeholder="在这里写计算过程..."></textarea>
    <button class="add-btn" style="margin-top:10px" onclick="closeDraft()">关闭</button>
  </div>
</div>
<script>
let errors = JSON.parse(localStorage.getItem('gk_errors')||'[]');
let favorites = JSON.parse(localStorage.getItem('gk_favorites')||'[]');
let reviewSchedule = JSON.parse(localStorage.getItem('gk_review')||'[]');
const MODULES = ['资料分析','数量关系','言语理解','判断推理','常识判断','申论'];

const pages = {
  overview: renderOverview, list: renderList, add: renderAdd,
  practice: renderPractice, speed: renderSpeed, favorites: renderFavorites,
  review: renderReview, timer: renderTimer, analytics: renderAnalytics, settings: renderSettings
};

function switchPage(p){
  document.querySelectorAll('.menu-item').forEach(i=>i.classList.remove('active'));
  document.querySelector(`.menu-item[data-page="${p}"]`)?.classList.add('active');
  const titles = {overview:'总览',list:'错题列表',add:'添加错题',practice:'刷题复习',speed:'速算训练',favorites:'收藏夹',review:'复习计划',timer:'模考计时',analytics:'数据分析',settings:'设置导出'};
  document.getElementById('pageTitle').textContent = titles[p]||'';
  document.getElementById('content').innerHTML = '';
  document.getElementById('favBadge').textContent = favorites.length;
  pages[p]();
}
document.getElementById('menu').addEventListener('click',e=>{const item=e.target.closest('.menu-item');if(item)switchPage(item.dataset.page)});

function renderOverview(){
  const c=document.getElementById('content');
  const total=errors.length,correct=errors.filter(e=>e.correct).length,rate=total?Math.round(correct/total*100):0;
  c.innerHTML=`<div class="card"><h3>📊 学习概览</h3><div style="display:flex;gap:20px;flex-wrap:wrap">
    <div style="text-align:center;flex:1;min-width:100px"><div style="font-size:36px;font-weight:700;color:var(--primary)">${total}</div><div style="color:#888">总错题</div></div>
    <div style="text-align:center;flex:1;min-width:100px"><div style="font-size:36px;font-weight:700;color:#10b981">${rate}%</div><div style="color:#888">正确率</div></div>
    <div style="text-align:center;flex:1;min-width:100px"><div style="font-size:36px;font-weight:700;color:#f59e0b">${reviewSchedule.length}</div><div style="color:#888">待复习</div></div>
  </div></div>
  <div class="card"><h3>📚 模块分布</h3><div class="modules">${MODULES.map(m=>`<div class="module-btn">${m}<br><small>${errors.filter(e=>e.module===m).length}题</small></div>`).join('')}</div></div>`;
}

function renderList(){
  const c=document.getElementById('content');
  if(!errors.length){c.innerHTML='<div class="card">暂无错题</div>';return}
  c.innerHTML=`<div class="card"><table><thead><tr><th>模块</th><th>题目</th><th>错因</th><th>操作</th></tr></thead><tbody>
    ${errors.map((e,i)=>`<tr><td>${e.module}</td><td>${(e.question||'').slice(0,30)}...</td><td>${e.reason||''}</td><td><button onclick="toggleFav(${i})">${favorites.includes(i)?'★':'☆'}</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function toggleFav(i){if(favorites.includes(i))favorites=favorites.filter(f=>f!==i);else favorites.push(i);localStorage.setItem('gk_favorites',JSON.stringify(favorites));renderList();switchPage('list')}

function renderAdd(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="card"><h3>➕ 添加错题</h3>
    <label>模块</label><select id="addModule">${MODULES.map(m=>`<option>${m}</option>`).join('')}</select>
    <label>题目内容</label><textarea id="addQuestion" rows="4" placeholder="粘贴或输入题目..."></textarea>
    <label>错因分析</label><input id="addReason" placeholder="如：计算错误、概念混淆...">
    <label>上传图片（OCR识别）</label><input type="file" id="addImage" accept="image/*">
    <button class="add-btn" onclick="saveError()">保存错题</button></div>`;
  document.getElementById('addImage').onchange=async e=>{const file=e.target.files[0];if(!file)return;const btn=document.querySelector('.add-btn');btn.textContent='识别中...';
    try{const{data:{text}}=await Tesseract.recognize(file,'chi_sim+eng');document.getElementById('addQuestion').value=text}catch(err){alert('OCR失败')}btn.textContent='保存错题'};
}
function saveError(){const m=document.getElementById('addModule').value,q=document.getElementById('addQuestion').value,r=document.getElementById('addReason').value;
  if(!q){alert('请填写题目');return}errors.push({module:m,question:q,reason:r,correct:false,date:Date.now()});localStorage.setItem('gk_errors',JSON.stringify(errors));
  reviewSchedule.push({index:errors.length-1,dates:[1,2,4,7,15].map(d=>Date.now()+d*86400000)});localStorage.setItem('gk_review',JSON.stringify(reviewSchedule));alert('保存成功！');switchPage('list')}

let practiceIdx=0,pTimer=0,pStart=0;
function renderPractice(){
  const c=document.getElementById('content');
  const due=errors.filter((e,i)=>reviewSchedule.some(r=>r.index===i&&r.dates.some(d=>Math.abs(d-Date.now())<86400000)));
  if(!due.length){c.innerHTML='<div class="card">🎉 今天没有待复习的错题！</div>';return}
  const cur=due[practiceIdx%due.length];
  c.innerHTML=`<div class="card"><h3>📝 刷题复习 <span style="font-size:13px;color:#888">${practiceIdx+1}/${due.length}</span></h3>
    <div style="margin-bottom:12px"><strong>模块：</strong>${cur.module}</div><div style="margin-bottom:12px;padding:12px;background:#f8fafc;border-radius:8px">${cur.question}</div>
    <div style="margin-bottom:12px"><strong>错因：</strong>${cur.reason||'未标注'}</div>
    <div style="display:flex;gap:10px;margin-bottom:16px"><button class="add-btn" onclick="openDraft()">✏️ 草稿纸</button><span id="pTimer" style="margin-left:auto;font-size:14px;color:#888">⏱️ 00:00</span></div>
    <div style="display:flex;gap:10px"><button class="btn-start" style="flex:1;padding:10px;border-radius:8px;border:none;background:#10b981;color:#fff;cursor:pointer" onclick="markCorrect()">✓ 做对了</button>
    <button class="btn-start" style="flex:1;padding:10px;border-radius:8px;border:none;background:#ef4444;color:#fff;cursor:pointer" onclick="practiceIdx++;renderPractice()">✗ 再做一次</button></div></div>`;
  pStart=Date.now();clearInterval(pTimer);pTimer=setInterval(()=>{const s=Math.floor((Date.now()-pStart)/1000);document.getElementById('pTimer').textContent=`⏱️ ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000);
}
function markCorrect(){clearInterval(pTimer);practiceIdx++;renderPractice()}
function openDraft(){document.getElementById('draftOverlay').style.display='block'}
function closeDraft(){document.getElementById('draftOverlay').style.display='none'}

// ========== SPEED TRAINING (资料分析标准) ==========
let speedScore=0,speedTotal=0,speedStart=0,speedTimer=null;
function renderSpeed(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="card"><h3>🧮 速算训练（资料分析）</h3>
    <p style="margin-bottom:16px;color:#888">模拟公考资料分析速算题型，每题限时30秒，点击选项作答</p>
    <div style="display:flex;gap:12px;margin-bottom:16px"><button class="add-btn" onclick="startSpeedRound()">开始练习</button>
    <span id="speedScore" style="margin-left:auto;font-size:14px;color:#888">正确：${speedScore} / ${speedTotal}</span></div>
    <div id="speedArea"></div></div>`;
}
function startSpeedRound(){
  clearInterval(speedTimer);
  const area=document.getElementById('speedArea');speedTotal++;
  const type=Math.floor(Math.random()*4)+1;
  let question='',correct=0,options=[];
  switch(type){
    case 1:const a=Math.floor(Math.random()*90000)+10000;const b=(Math.random()*20+5).toFixed(1);correct=a/(b/100);question=`计算：${a} ÷ ${b}% = ?`;break;
    case 2:const a2=Math.floor(Math.random()*9000)+1000;const b2=(Math.random()*30+10).toFixed(1);correct=a2*(b2/100);question=`计算：${a2} × ${b2}% = ?`;break;
    case 3:const base=Math.floor(Math.random()*900)+100;const growth=Math.floor(Math.random()*50)+10;const now=base+growth;correct=(growth/base)*100;question=`基期=${base}，现期=${now}，增长率约为？`;break;
    case 4:const now2=Math.floor(Math.random()*900)+200;const rate=(Math.random()*20+5).toFixed(1);correct=now2/(1+rate/100);question=`现期=${now2}，增长率=${rate}%，基期约为？`;break;
  }
  const rounded=Math.round(correct*10)/10;options=[rounded];
  while(options.length<4){const offset=(Math.random()*0.4+0.8)*(Math.random()>0.5?1:-1)*rounded;const fake=Math.round((rounded+offset)*10)/10;if(fake>0&&!options.includes(fake))options.push(fake)}
  options.sort(()=>Math.random()-0.5);
  area.innerHTML=`<div style="font-size:18px;font-weight:600;margin-bottom:16px;padding:16px;background:#f8fafc;border-radius:8px">${question}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${options.map(opt=>`<button onclick="checkSpeed(${opt},${rounded})" style="padding:14px;border:2px solid var(--border);border-radius:8px;background:#fff;font-size:16px;cursor:pointer">${opt}</button>`).join('')}</div>
    <div id="speedTimer" style="margin-top:12px;text-align:center;color:#888">⏱️ 30s</div>`;
  speedStart=Date.now();let timeLeft=30;
  speedTimer=setInterval(()=>{timeLeft--;document.getElementById('speedTimer').textContent=`⏱️ ${timeLeft}s`;if(timeLeft<=0){clearInterval(speedTimer);area.innerHTML+=`<div style="margin-top:12px;padding:10px;background:#fee2e2;border-radius:8px;text-align:center">⏰ 时间到！正确答案：${rounded}</div>`;setTimeout(startSpeedRound,1500)}},1000);
}
window.checkSpeed=function(sel,correct){clearInterval(speedTimer);const area=document.getElementById('speedArea');
  if(sel===correct){speedScore++;area.innerHTML+=`<div style="margin-top:12px;padding:10px;background:#d1fae5;border-radius:8px;text-align:center;color:#065f46">✅ 正确！用时${Math.round((Date.now()-speedStart)/1000)}s</div>`}
  else{area.innerHTML+=`<div style="margin-top:12px;padding:10px;background:#fee2e2;border-radius:8px;text-align:center;color:#991b1b">❌ 错误！正确答案：${correct}</div>`}
  document.getElementById('speedScore').textContent=`正确：${speedScore} / ${speedTotal}`;setTimeout(startSpeedRound,2000)};

function renderFavorites(){
  const c=document.getElementById('content');
  if(!favorites.length){c.innerHTML='<div class="card">暂无收藏</div>';return}
  c.innerHTML=`<div class="card"><h3>⭐ 收藏夹</h3><table><thead><tr><th>模块</th><th>题目</th><th>操作</th></tr></thead><tbody>
    ${favorites.map(fi=>{const e=errors[fi];return`<tr><td>${e?.module}</td><td>${(e?.question||'').slice(0,30)}...</td><td><button onclick="toggleFav(${fi});renderFavorites()">取消</button></td></tr>`}).join('')}
  </tbody></table></div>`;
}

function renderReview(){
  const c=document.getElementById('content');
  const today=Date.now();const todayR=reviewSchedule.filter(r=>r.dates.some(d=>Math.abs(d-today)<86400000));
  c.innerHTML=`<div class="card"><h3>🧠 复习计划（艾宾浩斯）</h3><p style="margin-bottom:12px;color:#888">今天待复习：<strong>${todayR.length}</strong> 题</p>
    <p style="margin-bottom:12px;color:#888">复习间隔：第1天 → 第2天 → 第4天 → 第7天 → 第15天</p>
    <button class="add-btn" onclick="switchPage('practice')">开始今日复习</button></div>`;
}

let tInt=null,tSec=0,tRun=false;
function renderTimer(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="card"><h3>⏱️ 模考计时器</h3><div style="margin-bottom:16px"><label>设置时长（分钟）</label><input type="number" id="timerSet" value="120" min="1"></div>
    <div class="timer-display" id="timerDisp">02:00:00</div>
    <div class="timer-controls"><button class="btn-start" onclick="startTimer()">开始</button><button class="btn-reset" onclick="pauseTimer()">暂停</button><button class="btn-reset" onclick="resetTimer()">重置</button></div></div>`;
}
function startTimer(){if(tRun)return;if(!tSec){tSec=(parseInt(document.getElementById('timerSet').value)||120)*60}tRun=true;tInt=setInterval(()=>{if(tSec<=0){clearInterval(tInt);alert('时间到！');return}tSec--;const h=Math.floor(tSec/3600),m=Math.floor(tSec%3600/60),s=tSec%60;document.getElementById('timerDisp').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`},1000)}
function pauseTimer(){tRun=false;clearInterval(tInt)}
function resetTimer(){tRun=false;clearInterval(tInt);tSec=0;document.getElementById('timerDisp').textContent='02:00:00'}

function renderAnalytics(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="card"><h3>📈 正确率趋势</h3><div class="chart-container"><canvas id="trendChart"></canvas></div></div>
    <div class="card"><h3>🎯 模块雷达图</h3><div class="chart-container"><canvas id="radarChart"></canvas></div></div>
    <div class="card"><h3>🏷️ 薄弱标签云</h3><div id="tagCloud" style="display:flex;flex-wrap:wrap;gap:8px"></div></div>`;
  new Chart(document.getElementById('trendChart').getContext('2d'),{type:'line',data:{labels:['第1周','第2周','第3周','第4周'],datasets:[{label:'正确率',data:[60,65,72,78],borderColor:'#5e72e4',fill:false,tension:.3}]},options:{responsive:true,maintainAspectRatio:false}});
  const rd=MODULES.map(m=>{const ms=errors.filter(e=>e.module===m);return ms.length?Math.round(ms.filter(e=>e.correct).length/ms.length*100):50});
  new Chart(document.getElementById('radarChart').getContext('2d'),{type:'radar',data:{labels:MODULES,datasets:[{label:'掌握度',data:rd,backgroundColor:'rgba(94,114,228,.2)',borderColor:'#5e72e4'}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:0,max:100}}}});
  const tc=document.getElementById('tagCloud');const reasons=errors.map(e=>e.reason).filter(Boolean);const freq={};reasons.forEach(r=>freq[r]=(freq[r]||0)+1);
  Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([tag,cnt])=>{const s=document.createElement('span');s.textContent=`${tag} ×${cnt}`;s.style.cssText=`padding:6px 14px;border-radius:20px;background:${cnt>3?'#fee2e2':'#dbeafe'};color:${cnt>3?'#dc2626':'#1d4ed8'};font-size:14px`;tc.appendChild(s)});
}

function renderSettings(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="card"><h3>⚙️ 设置与导出</h3><div class="export-btns" style="margin-bottom:20px">
    <button onclick="exportJSON()">📄 导出 JSON</button><button onclick="backup()">💾 备份</button><button onclick="restore()">📥 恢复</button></div>
    <div style="margin-top:20px;padding:12px;background:#fef3c7;border-radius:8px;font-size:13px;color:#92400e">⚠️ 数据存储在浏览器本地，请定期备份！</div></div>`;
}
function exportJSON(){const d=new Blob([JSON.stringify({errors,favorites,reviewSchedule},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(d);a.download='错题本备份.json';a.click()}
function backup(){localStorage.setItem('gk_backup',JSON.stringify({errors,favorites,reviewSchedule,time:Date.now()}));alert('✅ 已备份')}
function restore(){const d=JSON.parse(localStorage.getItem('gk_backup')||'{}');if(d.errors){errors=d.errors;favorites=d.favorites||[];reviewSchedule=d.reviewSchedule||[];localStorage.setItem('gk_errors',JSON.stringify(errors));localStorage.setItem('gk_favorites',JSON.stringify(favorites));localStorage.setItem('gk_review',JSON.stringify(reviewSchedule));alert('✅ 恢复成功');switchPage('overview')}else alert('没有备份')}

switchPage('overview');
</script>
</body>
</html>
